
# ============================================================
#                    LuLu SMP - TAB Config
# ============================================================

header-footer:
  enabled: true
  designs:
    default:
      header:
        - "<#55FFFF>&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</#AA55FF>"
        - "<#55FFFF>&l✦ &f&lLuLu <#AA55FF>&lSMP &r<#55FFFF>&l✦"
        - "&7Welcome back, <#FFFFFF>%player%&7!"
        - "&7There are <#55FFFF>&l%online% &7players online"
        - ""
      footer:
        - ""
        - "<#AA55FF>&l✦ &fSurvive &7• &fBuild &7• &fExplore <#AA55FF>&l✦"
        - "&7Your Ping: <#55FFFF>%ping%ms &7| Online: <#55FFFF>%online%"
        - "&7Server Memory: <#55FFFF>%memory-used%MB &7/ <#55FFFF>%memory-max%MB"
        - ""
        - "<#55FFFF>&m━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━</#AA55FF>"

tablist-name-formatting:
  enabled: true
  disable-condition: '%world%=disabledworld'

scoreboard-teams:
  enabled: true
  enable-collision: true
  invisible-nametags: false

  sorting-types:
    - "GROUPS:owner,admin,mod,helper,builder,vip,default"
    - "PLACEHOLDER_A_TO_Z:%player%"

  case-sensitive-sorting: false
  can-see-friendly-invisibles: false
  disable-condition: '%world%=disabledworld'

playerlist-objective:
  enabled: true
  value: "%ping%"
  fancy-value: "<#55FFFF>Ping: &f%ping%ms"
  title: "LuLu SMP"
  render-type: INTEGER
  disable-condition: '%world%=disabledworld'

belowname-objective:
  enabled: true
  value: "%health%"
  fancy-value: "<#FF5555>%health%❤"
  fancy-value-default: "NPC"
  title: "<#FF5555>Health"
  disable-condition: '%world%=disabledworld'

prevent-spectator-effect:
  enabled: false

bossbar:
  enabled: false
  toggle-command: /bossbar
  remember-toggle-choice: false
  hidden-by-default: false
  bars:
    ServerInfo:
      style: "PROGRESS"
      color: "PURPLE"
      progress: "100"
      text: "&fWelcome to <#55FFFF>&lLuLu SMP"

scoreboard:
  enabled: true
  toggle-command: /sb
  remember-toggle-choice: true
  hidden-by-default: false
  delay-on-join-milliseconds: 0

  scoreboards:
    scoreboard-1.20.3+:
      title: "<#55FFFF>&l✦ LuLu <#AA55FF>&lSMP ✦"
      display-condition: "%player-version-id%>=765;%bedrock%=false"
      lines:
        - "<#777777>%date%"
        - ""
        - "<#55FFFF>&lSERVER"
        - "&7• Online: &f%online%"
        - "&7• Staff: &f%staffonline%"
        - ""
        - "<#AA55FF>&lPLAYER"
        - "&7• Rank: &f%group%"
        - "&7• Ping: &f%ping%ms"
        - "&7• World: &f%world%"
        - ""
        - "<#55FFFF>&l✦ &fLuLu SMP"
    
    scoreboard:
      title: "<#55FFFF>&l✦ LuLu <#AA55FF>&lSMP ✦"
      lines:
        - "<#777777>%date%"
        - ""
        - "<#55FFFF>&lSERVER"
        - "&7• Online: &f%online%"
        - "&7• Staff: &f%staffonline%"
        - ""
        - "<#AA55FF>&lPLAYER"
        - "&7• Rank: &f%group%"
        - "&7• Ping: &f%ping%ms"
        - "&7• World: &f%world%"
        - ""
        - "<#55FFFF>&l✦ &fLuLu SMP"

layout:
  enabled: false
  direction: COLUMNS
  default-skin: mineskin:37e93c8e12cd426cb28fce31969e0674
  enable-remaining-players-text: true
  remaining-players-text: '... and %s more'
  empty-slot-ping-value: 1000

  layouts:
    default:
      slot-count: 80

ping-spoof:
  enabled: false
  value: 0

global-playerlist:
  enabled: false
  display-others-as-spectators: false
  display-vanished-players-as-spectators: true
  isolate-unlisted-servers: false
  update-latency: false

placeholders:
  date-format: "dd.MM.yyyy"
  time-format: "[HH:mm:ss / h:mm a]"
  time-offset: 0
  register-tab-expansion: false
  locale: en-US

placeholder-output-replacements:
  "%essentials_vanished%":
    "yes": "&7| Vanished"
    "no": ""

conditions:
  nick:
    conditions:
      - "%player%=%essentials_nickname%"
    true: "%player%"
    false: "~%essentials_nickname%"

placeholder-refresh-intervals:
  default-refresh-interval: 500
  "%server_uptime%": 1000
  "%server_tps_1_colored%": 1000
  "%server_unique_joins%": 5000
  "%player_health%": 200
  "%player_ping%": 1000
  "%vault_prefix%": 1000
  "%rel_factionsuuid_relation_color%": 1000

assign-groups-by-permissions: false

primary-group-finding-list:
  - Owner
  - Admin
  - Mod
  - Helper
  - default

permission-refresh-interval: 1000

debug: false

mysql:
  enabled: false
  host: 127.0.0.1
  port: 3306
  database: tab
  username: user
  password: password
  useSSL: true

proxy-support:
  enabled: false
  channel-name-suffix: "custom"
  type: PLUGIN

components:
  minimessage-support: true
  disable-shadow-for-heads: true

config-version: 6

per-world-playerlist:
  enabled: false
  allow-bypass-permission: false

  ignore-effect-in-worlds:
    - ignoredworld
    - build

  shared-playerlist-world-groups:
    lobby:
      - lobby1
      - lobby2
    minigames:
      - paintball
      - bedwars

compensate-for-packetevents-bug: false

use-bukkit-permissions-manager: false
use-online-uuid-in-tablist: true
